plugins {
	id 'net.fabricmc.fabric-loom' version '1.19-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
	accessWidenerPath = file("src/main/resources/ld-particles.accesswidener")
}

repositories {
	maven { url 'https://maven.isxander.dev/releases' }
	maven { url "https://maven.terraformersmc.com/releases/" }
    maven { 
        url "https://maven.nucleoid.xyz/"
        name "Nucleoid"
    }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	compileOnly("com.terraformersmc:modmenu:${project.modmenu}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
    implementation("eu.pb4:placeholder-api:${project.placeholder_api}")
	implementation("dev.isxander:yet-another-config-lib:${project.yacl}")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}"}
	}
	archiveFileName = project.property("archives_base_name") + "-" + project.property("minecraft_version") + "-" + project.property("mod_version") + ".jar"
}

sourcesJar {
	archiveFileName = project.property("archives_base_name") + "-" + project.property("minecraft_version") + "-" + project.property("mod_version") + "-sources.jar"
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
}
